name: Build Portable Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Postavi Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instaliraj pakete
        run: npm install

      - name: Kompajliraj Tauri aplikaciju
        run: npm run tauri build

      - name: Spremi gotovi EXE za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: Portable-Text-Editor-Windows
          path: src-tauri/target/release/*.exe
