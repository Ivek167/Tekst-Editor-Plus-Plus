[package]
name = "moj-editor-teksta"
version = "0.1.0"
description = "Prijenosni uređivač teksta"
authors = ["Vase Ime"]
edition = "2024"
autobins = false

[lib]
name = "moj_editor_teksta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Tekst Editor Plus Plus"
path = "src/main.rs"

[lib]
name = "moj_editor_teksta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[[bin]]
name = "Tekst Editor Plus Plus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = false
opt-level = "s"
panic = "abort"
strip = false
